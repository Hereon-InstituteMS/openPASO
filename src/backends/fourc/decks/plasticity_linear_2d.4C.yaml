TITLE:
  - "Small-strain (linear-kinematics) J2 elastoplasticity, plane strain."
  - "A strip is stretched 1% in x, well past the elastic limit, so the bulk of"
  - "the specimen flows plastically. Reaction force is monitored on the pulled face."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
DISCRETISATION:
  NUMFLUIDDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "GL"
  STRUCT_PLASTIC_STRAIN: "EA"
  VERBOSITY: "Standard"
IO/MONITOR STRUCTURE DBC:
  INTERVAL_STEPS: 1
  FILE_TYPE: csv
  PRECISION_SCREEN: 10
  WRITE_CONDITION_INFORMATION: true
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
  GAUSS_POINT_DATA_OUTPUT_TYPE: element_center
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  TOLDISP: 1e-10
  TOLRES: 1e-08
  MAXITER: 25
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
MATERIALS:
  - MAT: 1
    MAT_Struct_PlasticLinElast:
      YOUNG: 210000
      NUE: 0.3
      DENS: 7.85e-09
      YIELD: 250
      ISOHARD: 2000
      KINHARD: 0
      TOL: 1e-08
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0.1, 0, 0]
    FUNCT: [1, 0, 0]
    TAG: "monitor_reaction"
DESIGN POINT DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [0, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN VOL DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
