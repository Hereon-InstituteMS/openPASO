TITLE:
  - "3-D mortar penalty contact between two separate deformable bodies."
  - "A stiff punch (0.5 x 0.5 x 0.5, E=5000, nodes 51-68, 4 HEX8) hangs 0.05"
  - "above a soft foundation block (1 x 1 x 0.5, E=500, nodes 1-50, 16 HEX8)"
  - "that is clamped on its base. The punch top face is pushed down by 0.1"
  - "over one pseudo-time unit, so the gap closes at t=0.5 and the punch then"
  - "indents the foundation. The interface is a non-matching mortar surface"
  - "pair, DESIGN SURF MORTAR CONTACT CONDITIONS 3D (one Master entry, one"
  - "Slave entry, same InterfaceID), regularised by a penalty instead of by"
  - "Lagrange multipliers: CONTACT DYNAMIC STRATEGY Penalty + PENALTYPARAM."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "Statics"
  PREDICT: "TangDis"
  TIMESTEP: 0.05
  NUMSTEP: 20
  MAXTIME: 1.0
  TOLDISP: 1e-09
  TOLRES: 1e-07
  MAXITER: 30
  LINEAR_SOLVER: 1
CONTACT DYNAMIC:
  LINEAR_SOLVER: 2
  STRATEGY: "Penalty"
  PENALTYPARAM: 100000
  FRICTION: "None"
  SEMI_SMOOTH_NEWTON: true
MORTAR COUPLING:
  ALGORITHM: "Mortar"
  INTTYPE: "Segments"
  LM_SHAPEFCN: "Dual"
  LM_DUAL_CONSISTENT: "none"
  SEARCH_ALGORITHM: "BruteForce"
  SEARCH_PARAM: 0.5
MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
SOLVER 2:
  SOLVER: "UMFPACK"
  NAME: "Contact_Solver"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
  OUTPUT_DATA_FORMAT: "ascii"
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  OUTPUT_CONTACT: true
  ELEMENT_MAT_ID: true
MATERIALS:
  - MAT: 1
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 500
      NUE: 0.3
      DENS: 1
  - MAT: 2
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 5000
      NUE: 0.3
      DENS: 1
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, -0.1]
    FUNCT: [0, 0, 1]
DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 2
    InterfaceID: 1
    Side: "Master"
  - E: 3
    InterfaceID: 1
    Side: "Slave"
    Initialization: "Inactive"
