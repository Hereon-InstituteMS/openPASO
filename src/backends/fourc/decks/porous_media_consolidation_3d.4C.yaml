TITLE:
  - "3-D consolidation of a saturated poroelastic column, HEX8 poro elements."
  - "Column 0.1 x 0.1 x 1.0, surface load q=1 ramped on over 0.05 s, drained"
  - "at the top (p=0), impervious base and sides, lateral rollers all round."
  - "The 3-D counterpart of the 2-D Terzaghi deck: excess pore pressure starts"
  - "at ~q, dissipates upwards, settlement tends to q*H/E_oed = 9.0e-04."
  - "Element: SOLIDPORO_PRESSURE_VELOCITY_BASED (3 solid dofs/node, the pore"
  - "fluid lives on a cloned porofluid discretisation with vx,vy,vz,p)."
PROBLEM TYPE:
  PROBLEMTYPE: "Poroelasticity"
PROBLEM SIZE:
  DIM: 3
POROELASTICITY DYNAMIC:
  COUPALGO: "Monolithic"
  PHYSICAL_TYPE: "Poro"
  NUMSTEP: 80
  MAXTIME: 2.0
  TIMESTEP: 0.025
  ITEMAX: 25
  TOLINC_GLOBAL: 1e-08
  TOLRES_GLOBAL: 1e-08
  NORM_INC: "AbsGlobal"
  NORM_RESF: "AbsGlobal"
  SECONDORDER: false
  CONTIPARTINT: true
  RESULTSEVERY: 2
  RESTARTEVERY: 1000
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC:
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "OneStepTheta"
  DAMPING: "Material"
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC/ONESTEPTHETA:
  THETA: 1.0
FLUID DYNAMIC:
  LINEAR_SOLVER: 3
  THETA: 1.0
FLUID DYNAMIC/POROUS-FLOW STABILIZATION:
  SUPG: false
  GRAD_DIV: false
  RSTAB: "rstab_gls"
  DEFINITION_TAU: "Franca_Madureira_Valentin_Badia_Codina"
  EVALUATION_TAU: "integration_point"
  EVALUATION_MAT: "integration_point"
SOLVER 1:
  SOLVER: "UMFPACK"
SOLVER 2:
  SOLVER: "UMFPACK"
SOLVER 3:
  SOLVER: "UMFPACK"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 2
  OUTPUT_DATA_FORMAT: "ascii"
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
IO/RUNTIME VTK OUTPUT/FLUID:
  OUTPUT_FLUID: true
  PRESSURE: true
  VELOCITY: true
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "porofluid"
    TAR_MAT: 3
MATERIALS:
  - MAT: 1
    MAT_StructPoro:
      MATID: 2
      POROLAWID: 10
      INITPOROSITY: 0.4
  - MAT: 10
    MAT_PoroLawNeoHooke:
      BULKMODULUS: 1e+07
      PENALTYPARAMETER: 0.001
  - MAT: 2
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [4]
      DENS: 1.0
  - MAT: 4
    ELAST_CoupNeoHooke:
      YOUNG: 1000
      NUE: 0.2
  - MAT: 3
    MAT_FluidPoro:
      DYNVISCOSITY: 1.0
      DENSITY: 1.0
      PERMEABILITY: 0.001
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 3
    TIMES: [0.0, 0.05, 1000.0]
    DESCRIPTION: ["0.5*(1-cos(t*pi/0.05))", "1.0"]
DESIGN SURF NEUMANN CONDITIONS:
  - E: 3
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0.0, 0.0, -1.0]
    FUNCT: [0, 0, 1]
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN SURF PORO DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 4
    ONOFF: [1, 1, 0, 0]
    VAL: [0, 0, 0, 0]
    FUNCT: [0, 0, 0, 0]
  - E: 2
    NUMDOF: 4
    ONOFF: [0, 0, 1, 0]
    VAL: [0, 0, 0, 0]
    FUNCT: [0, 0, 0, 0]
  - E: 3
    NUMDOF: 4
    ONOFF: [0, 0, 0, 1]
    VAL: [0, 0, 0, 0]
    FUNCT: [0, 0, 0, 0]
DESIGN SURFACE PORO PARTIAL INTEGRATION:
  - E: 3
DESIGN VOLUME POROCOUPLING CONDITION:
  - E: 1
