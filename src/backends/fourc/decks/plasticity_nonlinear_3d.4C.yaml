TITLE:
  - "Finite-strain (nonlinear-kinematics) J2 elastoplasticity in 3-D: the classic"
  - "necking tensile bar. One eighth of a square-section bar is modelled with"
  - "symmetry planes; a 2% taper toward the symmetry plane triggers necking."
  - "Units: GPa, mm. Reaction force is monitored on the pulled end."
