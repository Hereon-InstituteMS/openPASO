# SPH: hydrostatic free-surface column (weakly compressible, 1-D kernel).
# A column of fluid particles rests on three layers of boundary particles and
# is loaded by gravity. The steady state is the hydrostatic density/pressure
# profile rho(x) = rho0 * (1 + rho0*g*(H-x)/K).
PROBLEM TYPE:
  PROBLEMTYPE: "Particle"
IO:
  STDOUTEVERY: 1000
  VERBOSITY: "Standard"
# Neighbour search grid. BIN_SIZE_LOWER_BOUND must be >= the kernel support
# radius (= INITRADIUS of the materials). Every particle must stay inside
# DOMAINBOUNDINGBOX for the whole run.
BINNING STRATEGY:
  BIN_SIZE_LOWER_BOUND: 0.2
  DOMAINBOUNDINGBOX: "-0.5 -0.15 -0.15 5.0 0.15 0.15"
PARTICLE DYNAMIC:
  INTERACTION: "SPH"
  DYNAMICTYPE: "VelocityVerlet"
  RESULTSEVERY: 500
  RESTARTEVERY: 4000
  TIMESTEP: 0.5
  NUMSTEP: 4000
  MAXTIME: 2000
  # gravity points along -x, i.e. "down" the column
  GRAVITY_ACCELERATION: "-0.0001 0.0 0.0"
  GRAVITY_RAMP_FUNCT: 1
  # artificial damping that lets the column relax to the static solution
  VISCOUS_DAMPING: 0.1
  PHASE_TO_DYNLOADBALFAC: "phase1 1.0 boundaryphase 1.0"
  PHASE_TO_MATERIAL_ID: "phase1 1 boundaryphase 2"
# Core SPH discretisation switches: smoothing kernel, spatial dimension of the
# kernel, initial particle spacing, how the density is evolved, and how the
# wall (boundary) particles enter the fluid equations.
PARTICLE DYNAMIC/SPH:
  KERNEL: "CubicSpline"
  KERNEL_SPACE_DIM: "Kernel1D"
  INITIALPARTICLESPACING: 0.1
  EQUATIONOFSTATE: "GenTait"
  MOMENTUMFORMULATION: "AdamiMomentumFormulation"
  DENSITYEVALUATION: "DensityIntegration"
  BOUNDARYPARTICLEFORMULATION: "AdamiBoundaryFormulation"
# Gravity is ramped up smoothly over the first 500 time units to avoid a
# shock at t = 0.
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 3
    TIMES: [0, 500, 10000]
    DESCRIPTION: ["0.5*(1.0-cos((t*pi)/500.0))", "1.0"]
# BULK_MODULUS sets the artificial speed of sound c = sqrt(K/rho0) and hence
# the stable time step. INITRADIUS is the kernel support radius.
MATERIALS:
  - MAT: 1
    MAT_ParticleSPHFluid:
      INITRADIUS: 0.2
      INITDENSITY: 1
      REFDENSFAC: 1
      EXPONENT: 1
      BACKGROUNDPRESSURE: 0
      BULK_MODULUS: 0.01
      DYNAMIC_VISCOSITY: 0
      BULK_VISCOSITY: 0
      ARTIFICIAL_VISCOSITY: 0
  - MAT: 2
    MAT_ParticleSPHBoundary:
      INITRADIUS: 0.2
      INITDENSITY: 1
# Initial particle positions. "boundaryphase" are the three wall layers at the
# bottom of the column, "phase1" is the fluid.
PARTICLES:
  - "TYPE boundaryphase POS -0.25 0.0 0.0"
  - "TYPE boundaryphase POS -0.15 0.0 0.0"
  - "TYPE boundaryphase POS -0.05 0.0 0.0"
  - "TYPE phase1 POS 0.05 0.0 0.0"
  - "TYPE phase1 POS 0.15 0.0 0.0"
  - "TYPE phase1 POS 0.25 0.0 0.0"
  - "TYPE phase1 POS 0.35 0.0 0.0"
  - "TYPE phase1 POS 0.45 0.0 0.0"
  - "TYPE phase1 POS 0.55 0.0 0.0"
  - "TYPE phase1 POS 0.65 0.0 0.0"
  - "TYPE phase1 POS 0.75 0.0 0.0"
  - "TYPE phase1 POS 0.85 0.0 0.0"
  - "TYPE phase1 POS 0.95 0.0 0.0"
