TITLE:
  - "Elastohydrodynamic lubrication (EHL): a soft hyperelastic curved pad is"
  - "pressed onto a rigid plate that slides underneath it. A 2-D Reynolds"
  - "lubrication film (LUBRICATION QUAD4 elements) lives on the contact"
  - "surface and is coupled monolithically to the 3-D solid mechanics through"
  - "a mortar EHL interface, so film pressure and gap solve together."
PROBLEM TYPE:
  PROBLEMTYPE: "Elastohydrodynamic_Lubrication"
DISCRETISATION:
  NUMSTRUCDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
IO:
  STRUCT_DISP: false
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  NUMSTEP: 5000000
  MAXTIME: 1000
  DAMPING: "Rayleigh"
  M_DAMP: 1e-05
  K_DAMP: 1e-05
  TOLDISP: 1e-08
  MAXITER: 100
  MINITER: 2
  DIVERCONT: "continue"
  PREDICT: "ConstVel"
  LINEAR_SOLVER: 1
CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
  FRICTION: "Coulomb"
  FRLESS_FIRST: true
  STRATEGY: "Ehl"
  SEMI_SMOOTH_CN: 10
  SEMI_SMOOTH_CT: 10
  REGULARIZED_NORMAL_CONTACT: true
  REGULARIZATION_THICKNESS: 0.0025
  REGULARIZATION_STIFFNESS: 0.1
MORTAR COUPLING:
  SEARCH_PARAM: 10000
  INTTYPE: "Elements_BS"
  NUMGP_PER_DIM: 2
  TRIANGULATION: "Center"
MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"
LUBRICATION DYNAMIC:
  MAXTIME: 100
  NUMSTEP: 3000
  TIMESTEP: 0.001
  CALCERRORNO: 2
  LINEAR_SOLVER: 1
  ABSTOLRES: 1e-08
  CONVTOL: 1e-06
  PENALTY_CAVITATION: 1e+08
  GAP_OFFSET: 0.0025
  ADD_SQUEEZE_TERM: true
ELASTO HYDRO DYNAMIC:
  RESTARTEVERYTIME: 1
  NUMSTEP: 20
  MAXTIME: 10
  TIMESTEP: 0.5
  ITEMAX: 200
  UNPROJ_ZERO_DBC: true
  DRY_CONTACT_MODEL: true
ELASTO HYDRO DYNAMIC/MONOLITHIC:
  CONVTOL: 1e+10
  TOLINC: 1e-10
  NORMCOMBI_RESFINC: "And"
  ITERNORM: "L2"
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [10]
      DENS: 1
  - MAT: 10
    ELAST_CoupNeoHooke:
      YOUNG: 0.01
  - MAT: 2
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [20]
      DENS: 1
  - MAT: 20
    ELAST_CoupNeoHooke:
      YOUNG: 0.01
  - MAT: 3
    MAT_lubrication:
      LUBRICATIONLAWID: 30
      DENSITY: 1
  - MAT: 30
    MAT_lubrication_law_constant:
      VISCOSITY: 4e-08
# FUNCT1 drives the sliding velocity of the rigid plate, FUNCT2 the normal
# squeeze motion of the pad. Edit these to change the loading history.
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 4
    TIMES: [0, 1, 5, 100000]
    DESCRIPTION: ["0", "0", "0.005*(t-5)*(t-5)"]
FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "b"
  - VARIABLE: 0
    NAME: "b"
    TYPE: "multifunction"
    NUMPOINTS: 4
    TIMES: [0, 1, 5, 100000]
    DESCRIPTION: ["0.05*t", "0.05*1", "0.05*1"]
# Zero film pressure at the two open ends of the lubrication film.
DESIGN LINE DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 1
    ONOFF: [1]
    VAL: [0]
    FUNCT: [0]
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, -1, 0]
    FUNCT: [0, 2, 0]
  - E: 4
    NUMDOF: 1
    ONOFF: [0]
    VAL: [0]
    FUNCT: [0]
DESIGN VOL DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [1, 0, 0]
    FUNCT: [1, 0, 0]
# The EHL mortar interface: slave = pad underside, master = rigid plate top.
DESIGN SURF EHL MORTAR COUPLING CONDITIONS 3D:
  - E: 2
    InterfaceID: 1
    Side: "Slave"
    Initialization: "Inactive"
    FrCoeffOrBound: 0.3
  - E: 3
    InterfaceID: 1
    Side: "Master"
    Initialization: "Inactive"
    FrCoeffOrBound: 0.3

